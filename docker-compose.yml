services:
  postgres:
    image: postgres:16-alpine
    container_name: vnexpress-postgres
    environment:
      POSTGRES_USER: vnexpress
      POSTGRES_PASSWORD: vnexpress123
      POSTGRES_DB: vnexpress_scraper
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnexpress"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
